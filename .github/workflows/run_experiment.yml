name: run_experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # 何を実行し、何を取得し、何を残すかは formal/declaration.json が決める
      - run: python3 formal/cli.py run
      - uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: run-output/
          if-no-files-found: error
